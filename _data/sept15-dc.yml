- date: "Sept 15, 2026"
  title: Agentic 101 DC (Co-located with State of the Stack)
  body: "Our inaugural Agentic 101 event! This one-day workshop for enterprise developers and devops professionals will get you started with open models and local agentic engineering. Head over to the <a href=\"https://dcstateofthestack.org/registration/\" target=\"_null\">registration page</a> at the DC State of the Stack event site. Registration is $50 per person - <a href=\"mailto:massopen@massopen.ai\">ask about group discounts</a>.<p><br /><strong>Agenda</strong></p><p><br /></p><p>9:30am - 10am: Kickoff - the latest in open source AI management and governance<br /><p>10am - 11am: Getting Started with Local Models(Quantization, Harnesses, etc.)<br /><p>11am - noon: Coding with Multipal Agent Personas<br />noon - 1pm: Lunch (provided)<br />1pm - 2pm: Getting Started with Ontologies and Data Graphs<br />2pm - 3pm: InnerSource and Agentic Engineering - a hands-on guide<br />3pm - 5pm: Hands-on Experimentation (quantization, constructing a harness, coding with agent personas, constructing ontologies, etc.)<br />5pm - 7pm: Happy Hour (sponsoredby <a href=\"https://generationship.ai\" target=\"_null\">Generationship</a>)"

