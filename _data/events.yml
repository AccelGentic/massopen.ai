# Events, rendered as the list on the home page and synced into the database
# by `tools/agenda.php sync` so talks can be scheduled against them.
#
# This file is the source of truth for event wording. Each entry needs:
#
#   slug       stable id, never change it once talks are scheduled
#   image      header image at the top of an event agenda
#   Image_alt  alt text for the image above
#   starts_on  machine-readable date (YYYY-MM-DD); `date` stays the display form
#   title      shown on the home page and at the top of the agenda
#   location   optional, shown under the agenda heading
#   body       home-page teaser only; not used by the agenda
#   image      optional; banner at the top of the event's agenda page and the
#              thumbnail on its card at /agenda/. A path under the site
#              ("/assets/img/events/sept15-dc.jpg") or a full https:// URL.
#              Leave it out and the agenda looks for a file named after the
#              slug in assets/img/events/; with neither, the card keeps the ◇.
#   image_alt  optional; alt text for that image. Defaults to the title.
#   registration
#              optional; how to register, shown under the title on the event's
#              agenda page. See _includes/agenda/registration.html for the
#              fields. Omit it entirely for an event with nowhere to send
#              people yet — it then renders nothing.
- slug: sept15-dc
  image: /assets/img/events/sept15-dc.jpg
  image_alt: Cherry blossoms in full bloom on the Potomac - image courtesy of Yeon Choi (@yeonji12) at Unsplash
  date: "Sept 15, 2026"
  starts_on: 2026-09-15
  title: Agentic 101 - Washington, DC (State of the Stack)
  location: Washington, DC
  body: "Our inaugural Agentic 101 event! <a href=\"agenda/sept15-dc/\">(agenda)</a>"
  registration:
    status: open
    price: $50 ($20 for DC SotS Attendees)
    url: https://dcstateofthestack.org/registration/
    cta: Register at DC State of the Stack
    note: 'Registration is handled by the DC State of the Stack event site.'

