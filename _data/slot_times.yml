# Start time for each running-order slot on the agenda.
#
# Keys are the `slot_order` set in the review console, as strings. A talk whose
# slot has no entry here falls back to showing the slot number, so adding a
# ninth slot is a matter of adding a line rather than editing a template.
"0": "9:30am"
"1": "10:00am"
"2": "10:45am"
"3": "11:30pm"
"4": "12:45pm"
"5": "1:30pm"
"6": "2:15pm"
"7": "3:00pm"
"8": "4:00pm"
"9": "5:00pm"
