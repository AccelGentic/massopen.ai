- date: "Sept 24, 2026"
  title: Agentic 101 Boston (at Glasswing Ventures)
  body: "Agentic 101 is coming to Boston - thanks to the generosity of our hosts, <a href=\"https://glasswing.vc\" target=\"_blank\">Glasswing Ventures</a>. This one-day workshop for enterprise developers and devops professionals will get you started with open models and local agentic engineering.Registration will be $50 per person - add your <a href=\"https://news.massopen.ai/\">email to the list</a> and get notified when we're open for business..<p><br /><strong>Agenda</strong></p><p><br /></p><p>9:30am - 10am: Kickoff - the latest in open source AI management and governance<br /><p>10am - 11am: Getting Started with Local Models(Quantization, Harnesses, etc.)<br /><p>11am - noon: Coding with Multipla Agent Personas<br />noon - 1pm: Lunch (provided)<br />1pm - 2pm: Getting Started with Ontologies and Data Graphs<br />2pm - 3pm: InnerSource and Agentic Engineering - a hands-on guide<br />3pm - 5pm: Hands-on Experimentation (quantization, constructing a harness, coding with agent personas, constructing ontologies, etc.)<br />5pm - 7pm: Happy Hour (sponsoredby <a href=\"https://generationship.ai\" target=\"_null\">Generationship</a>) </p><p><br />"

