events:
  - slug: "sept15-dc"
    title: "Agentic 101 - Washington, DC (State of the Stack)"
    starts_on: "2026-09-15"
    location: "Washington, DC"
    talks:
      - slug: "your-agent-works-is-it-suitable-for-your-setting-3"
        speaker: "Reva Schwartz"
        bio: "Reva Schwartz is a research scientist and linguist, and co-founder of Civitaas Insights, which builds tooling to help organizations determine whether their AI deployments meet the demands of their setting. She also directs FRAME (Forum for Real-World AI Measurement and Evaluation) at Virginia State University's Center for Responsible AI. Reva spent 20+ years in U.S. federal service. She most recently led national AI evaluation efforts at NIST, where she founded the ARIA program, led the institute's work on harmful bias in AI, and served as lead architect of the AI Risk Management Framework Playbook."
        topic: "Your Agent Works. Is It Suitable for Your Setting?"
        abstract: "A major roadblock to enterprise adoption of AI is knowing whether a given system will actually be suitable for a specific deployment. The setting in which AI systems are deployed plays a bigger role than the model you choose. Yet nearly every metric and approach that enterprises rely on—such as evaluations, benchmarks, red teaming, and engagement—is designed around the technology, not the setting.  I'll describe this disconnect, why it isn't new to AI, and what it would take for enterprises and the startups selling to them to close that distance."
        slot: "1"
      - slug: "red-teaming-for-agentic-safety-and-security-5"
        speaker: "Adrianna Tan"
        bio: "Adrianna is the founder of Future Ethics Lab, and she focuses on AI evaluations, red teaming, deployment readiness, and governance, particularly in high-stakes environments such as government, healthcare, and public services.  Over the past several years Adrianna has worked with governments, researchers, and private-sector organizations to understand how AI systems behave under real-world conditions, including multilingual and multicultural contexts that are often overlooked in standard benchmarks and testing approaches."
        topic: "Red-teaming for Agentic Safety and Security"
        abstract: "Adrianna will talk about how to get started with agentic red-teaming:  - how to implement guardrails and prove (or disprove) that they work - how to prevent your bot from diverging from the approved workflow - how to collect and present evidence for auditors"
        slot: "2"
      - slug: "houston-we-have-a-provenance-problem-4"
        speaker: "Jonathan Altman"
        bio: "Jonathan Altman is a Distinguished Engineer on the Digital Vertical SRE team at GEICO."
        topic: "Houston, We Have a Provenance Problem"
        abstract: "The efforts to just hand engineers LLMs are:  - Just a new symptom of an old problem, we want better output from our engineers (more, faster, higher quality) so we want to give them guardrails or tools to ensure quality outcomes - We still task those same engineers with either creating or evaluating the guardrails - In this case, the solution was handing every engineer a team of infinitely scalable software interns - The solution: nothing has changed in software engineering.  It's still critical that code gets code-reviewed earnestly by competent engineers who understand the problem space.  That requires walking away from generating 1000's of lines of slop.  Even that is not a new problem.  We ran into difficulties already on evaluating code for frontends like React or Angular that involve lots of boilerplate."
        slot: "3"
      - slug: "loop-engineering-101-building-reliable-self-correcting-ai-wo-6"
        speaker: "Ragha Vema"
        bio: "Ragha Vema is an Enterprise Architect with 20+ years of development experience in the full Software Project Lifecycle. He is an expert in AWS cloud and CICD Tool Integrations as well as building Enterprise grade Delivery Pipelines."
        topic: "Loop Engineering 101: Building Reliable, Self-Correcting AI Workflows"
        abstract: "The hardest part of building production AI systems is no longer writing the initial prompt it is managing what happens next. When autonomous agents operate in multi-step workflows, minor inaccuracies compound into catastrophic errors, context drifts, and loops spin endlessly without reaching a solution.  Loop Engineering 101 introduces the foundational principles of designing, supervising, and bounding agentic feedback loops. This session breaks down the core anatomy of an effective AI loop . Prompt -> Action -> Verification -> Correction and shows why robust verification is the real engine of agent autonomy. In this talk, you will learn about:      The essential anatomy of iterative agent architectures and how state flows between iterations.      Deterministic vs. Semantic Verification      Convergence & Stopping Conditions      Human-in-the-Loop Thresholds"
        slot: "4"
      - slug: "finally-a-fix-for-stupid-building-ai-guardrails-for-humans-w-7"
        speaker: "Jackie Peters"
        bio: "Jackie Peters is co-founder and CEO of Blind Insight, where she builds cryptographic systems that let AI and agents learn from data it's not allowed to see. She taught herself to code at 19, and started her first company at 20 building and selling across regulated industries long before Blind Insight, where run-ins with HIPAA and the potential for misuse of personal data wove the common thread that today is Blind Insight. Her writing on data ownership and where AI and regulation collide has been featured in Newsweek and IB Times."
        topic: "Finally, a Fix for 'Stupid?': Building AI Guardrails for Humans Who Copy-Paste PII"
        abstract: "Enterprise AI is having its hair-on-fire moment. Agents are breaking out of their sandboxes. Employees are uploading sensitive data into chatbots at record rates. Public model hubs leak secrets and ship poisoned models. And the regulators all arrived at once — DORA wants your data protected in use, GDPR and HIPAA never left, enforcement for the EU's AI Act is rolling out over the next two years, and the DOJ's new Data Security Program restricts moving Americans' bulk data across borders at all.  Everyone's racing to bolt agents onto their stack. Almost no one stops for the first question: is your governance actually alive? Not a policy PDF someone wrote in 2019, not a spreadsheet — a living, breathing control layer that decides, in the moment, who and what is allowed to touch which data. Without that, agentic AI doesn't make you faster. It makes you a breach with a roadmap.  This talk is about building that layer — and then doing the fun part safely: letting humans and machines work across your most sensitive data without anyone, or any agent, running amok and spilling it everywhere. I'll show how ontologies, data graphs, and per-request key orchestration decide what each agent may see, catch the queries that would re-identify someone or cross a border, and keep the data encrypted the whole way through. Open-source pieces you can pick up today, and a link to try it yourself.  Less data police. More hope: you don't have to choose between using your data and protecting it."
        slot: "5"
      - slug: "mcp-servers-the-agentic-api-layer-8"
        speaker: "Langdon White"
        bio: "Langdon White is a systems architect, open source strategist, and educator focused on scalable technologies and inclusive pathways into tech. He currently serves as Clinical Assistant Professor at Boston University and Technical Director of Spark!, where he guides student teams and faculty partners in building real-world data products and cloud-native systems."
        topic: "MCP Servers - The Agentic API Layer"
        abstract: "You may already use MCP servers shipped with your favorite tools. You may even have added community servers for the tools you use every day. But what does an MCP server actually do, what does it add to an ordinary API, and what will it take to run one beyond a local demo?  In this hands-on session, we will build a simple MCP server together and use it from an MCP-capable client. A public reference implementation will keep everyone moving if local code goes sideways. We will then put the same capability behind a direct API and compare the two interfaces—not as a performance or cost benchmark, but to expose what MCP adds and when that additional machinery earns its keep.  Finally, we will take the simple server toward production: deployment, authentication and credentials, permissions, observability, versioning, and failure handling. Attendees will leave able to explain how an MCP server works, recognize when an API is enough, and identify the work required to operate an MCP server after the prototype succeeds."
        slot: "6"
      - slug: "innersource-for-agents-10"
        speaker: "John Mark Walker"
        bio: "A proven open source product, community, and ecosystem expert, John Mark has built numerous enterprise software communities, launched new product initiatives, and implemented collaborative processes with key stakeholders. He works cross-functionally with legal, marketing, product development, and engineering teams to achieve strategic goals of community engagement. John Mark wrote \"There is no Open Source Community\" (http://johnmark.org/tinosc.html) in January 2006 documenting the economic drivers behind open source adoption and has spoken at numerous conferences on the subject of open source community engagement and strategy."
        topic: "InnerSource for Agents"
        abstract: "InnerSource in an agentic environment requires making some changes in your implementation:  - agents are just like any other contributor - make sure your branching rules are solidified - make sure your agents have the context of your projects to make relevant contributions, including curated software repository metadata, and coding policies - make sure your review process has humans in the loop - modify your pipeline YAML to measure trust - make a system of record for all changes for auditability - in the InnerSource loop, your agents will write, commit, and test code before it is merged. Make sure you have valid controls in place before code goes into production."
        slot: "7"
