<section class="section" id="oct01-bos">
  <div class="container">
    <ol class="dates">
      {% for item in site.data.oct01-bos %}
        <li class="date">
          <span class="date__num accent">{{ item.date }}</span>
          <div class="date__body">
            <h3 class="date__title">{{ item.title }}</h3>
            <p>{{ item.body }}</p>
          </div>
        </li>
      {% endfor %}
    </ol>
  </div>
</section>
