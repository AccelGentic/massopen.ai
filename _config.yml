# --- Site settings -----------------------------------------------------------
title: Mass Open
tagline: Mass Open. Mass AI. Mass Community.
description: >-
  Growing the open source AI community in Boston, New England, and the Acela corridor. Mass Open is a gathering
  point for enterprise developers, builders, researchers, and the open-source-curious across
  Massachusetts, New England, New York, and DC.
author: AccelGentic 
url: "https://massopen.ai"
baseurl: ""
lang: en

# --- Build settings ----------------------------------------------------------
encoding: utf-8
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Files Jekyll should not copy into the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - .gitignore
  # Never publish the schema — it would be downloadable at /schema.sql.
  - schema.sql
  # Build-time asset generation; not part of the site.
  - tools

# Keep the PHP endpoint and its config as static files in the output so the
# signup form keeps working when deployed to a PHP-enabled host.
keep_files:
  - submit.php
  - confirm.php
  - unsubscribe.php
  - subscribe_lib.php
  - cfp_token.php
  - cfp_submit.php
  - cfp_confirm.php
  - contact_submit.php
  - db_config.php
  - mail_config.php

# --- Navigation --------------------------------------------------------------
# Drives the top nav. Items with an `anchor` jump to a section on the home page;
# items with a `url` link to a standalone page.
nav:
  - title: Mission
    anchor: mission
  - title: Events
    anchor: events
  - title: Read
    anchor: read
  - title: Join
    anchor: join
  - title: CFP
    url: /cfp/
  - title: Sponsors
    url: /sponsors/
  - title: Contact
    url: /contact/

# --- Outbound links ----------------------------------------------------------
essay:
  title: "In the Afterglow of Boston Tech Week, Whither Boston Technology?"
  url: "https://www.linkedin.com/pulse/afterglow-tech-week-whither-boston-technology-john-mark-walker-annae/"
