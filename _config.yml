# --- Site settings -----------------------------------------------------------
title: Mass Open
tagline: Mass Open. Mass AI. Mass Community.
description: >-
  Growing the open source AI community in Boston, New England, and the Acela corridor. Mass Open is a gathering
  point for enterprise developers, builders, researchers, and the open-source-curious across
  Massachusetts, New England, New York, and DC.
author: AccelGentic 
url: "https://massopen.ai"

# The newsletter lives on its own self-hosted Ghost instance. Referenced by
# the nav (via `external: news_url`) and the hero button — change it here only.
news_url: "https://news.massopen.ai/"
baseurl: ""
lang: en

# --- Build settings ----------------------------------------------------------
encoding: utf-8
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Files Jekyll should not copy into the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - .gitignore
  # Never publish the schema — it would be downloadable at /schema.sql.
  - schema.sql
  # Build-time asset generation; not part of the site.
  - tools

# Files in the destination that Jekyll must NOT delete when it cleans.
# Only the CFP endpoints remain; the newsletter signup was retired in favour
# of the Ghost site at news.massopen.ai.
keep_files:
  - subscribe_lib.php
  - cfp_token.php
  - cfp_submit.php
  - cfp_confirm.php
  - cfp_admin.php
  - contact_submit.php
  - db_config.php
  - mail_config.php

# --- Navigation --------------------------------------------------------------
# Drives the top nav. Items with an `anchor` jump to a section on the home page;
# items with a `url` link to a standalone page.
nav:
  - title: Mission
    anchor: mission
  - title: Events
    url: /agenda/
  # The newsletter is a separate, self-hosted Ghost site on its own subdomain.
  # `external` names a top-level site key so the URL is defined once, below.
  - title: News
#    external: news_url removing this for now
    anchor: news 
  - title: CFP
    url: /cfp/
  - title: Sponsors
    url: /sponsors/
  - title: Contact
    url: /contact/

collections:
  external_feed: 
    output: false
    
    # --- Outbound links ----------------------------------------------------------
essay:
  title: "In the Afterglow of Boston Tech Week, Whither Boston Technology?"
  url: "https://www.linkedin.com/pulse/afterglow-tech-week-whither-boston-technology-john-mark-walker-annae/"
